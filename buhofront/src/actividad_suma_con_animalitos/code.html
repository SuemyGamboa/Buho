<script>
  (function() {
    const cards = document.querySelectorAll('.answer-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.className = 'answer-card group relative bg-surface-container-lowest rounded-lg h-24 flex flex-col items-center justify-center shadow-[0_6px_0_#d7e4ec] active:translate-y-1 active:shadow-[0_2px_0_#d7e4ec] transition-all';
          const badge = c.querySelector('.font-badge-label');
          if (badge) badge.className = 'absolute top-2 left-3 font-badge-label text-badge-label text-outline uppercase font-extrabold';
          const num = c.querySelector('.font-display-hero');
          if (num) num.className = 'font-display-hero text-display-hero-mobile text-inverse-surface leading-none';
          const checkIcon = c.querySelector('.material-symbols-outlined.text-sm');
          if (checkIcon && checkIcon.parentElement) checkIcon.parentElement.remove();
        });

        card.className = 'answer-card group relative bg-primary-fixed rounded-lg h-24 flex flex-col items-center justify-center shadow-[0_6px_0_#a9c7ff] active:translate-y-1 active:shadow-[0_2px_0_#a9c7ff] transition-all';
        const activeBadge = card.querySelector('.font-badge-label');
        if (activeBadge) activeBadge.className = 'absolute top-2 left-3 font-badge-label text-badge-label text-primary uppercase font-extrabold';
        const activeNum = card.querySelector('.font-display-hero');
        if (activeNum) activeNum.className = 'font-display-hero text-display-hero-mobile text-on-primary-fixed leading-none';
        
        const check = document.createElement('div');
        check.className = 'absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm';
        check.innerHTML = '<span class="material-symbols-outlined text-sm font-bold">check</span>';
        card.appendChild(check);
      });
    });

    const audioBtn = document.getElementById('audio-prompt-btn');
    if (audioBtn) {
      audioBtn.addEventListener('click', () => {
        audioBtn.classList.add('scale-95');
        setTimeout(() => audioBtn.classList.remove('scale-95'), 150);
      });
    }
  })();
